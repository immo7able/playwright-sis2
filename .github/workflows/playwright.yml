name: Playwright Tests

on:
  push:              # every push to every branch (no branch filter)
  pull_request:      # every pull request
  workflow_dispatch: # manual "Run workflow" button, used for the timing measurements

# A new push to the same branch cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false            # one failed shard does not cancel the others
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm              # caches ~/.npm, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          # Optional repository variable; empty -> config falls back to practicesoftwaretesting.com
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1       # intermediate file, only needed by merge-reports

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14
          if-no-files-found: ignore   # test-results/ is empty when everything passes on the first try

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}       # also runs when some tests failed
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14
